name: custom_spotify
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: any
  youtube_explode_dart: any
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/lang/
  fonts:
    - family: CircularSp
      fonts:
        - asset: assets/fonts/CircularSp-Cyrl-Book.ttf
          weight: 300
        - asset: assets/fonts/CircularSp-Cyrl-Bold.ttf
          weight: 700
        - asset: assets/fonts/CircularSp-Cyrl-Black.ttf
          weight: 900
    - family: Spoticon
      fonts:
        - asset: assets/fonts/spoticon.ttf
    - family: SpotifyMix
      fonts:
        - asset: assets/fonts/SpotifyMixUI-Regular.ttf
        - asset: assets/fonts/SpotifyMixUI-Bold.ttf
          weight: 700
