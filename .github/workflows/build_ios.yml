name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Initialize Project and Get Dependencies
        run: |
          flutter create --platforms ios .
          flutter pub get

      - name: Fix iOS Deployment Target
        run: |
          # The Podfile is created after flutter pub get
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# platform :ios.*/platform :ios, '14.0'/g" ios/Podfile
          fi
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 11.0/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS Application (Release, unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -q CustomSpotify-iOS.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomSpotify-iOS
          path: build/ios/iphoneos/CustomSpotify-iOS.ipa
          retention-days: 7
